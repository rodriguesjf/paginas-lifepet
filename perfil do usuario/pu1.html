<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - LifePet</title>

    <link rel="stylesheet" href="css/pu1.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

    <!-- HEADER -->

    <header>

        <!-- ESQUERDA -->

        <div class="left-header">

            <!-- MENU -->

            <div class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </div>

            <!-- PESQUISA -->

            <div class="search-box">

                <input
                type="text"
                placeholder="Pesquise aqui o que está procurando...">

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </div>

        <!-- DIREITA -->

        <div class="header-icons">

            <i class="fa-regular fa-calendar-days"></i>

            <i class="fa-regular fa-bell"></i>

            <div class="profile-mini">
                <i class="fa-solid fa-user"></i>
            </div>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <!-- TÍTULO -->

        <div class="page-title">

            <div class="back-button">
                <i class="fa-solid fa-arrow-left"></i>
            </div>

            <h1>Meu perfil</h1>

        </div>

        <!-- CARD -->

        <section class="profile-container">

            <!-- PERFIL -->

            <div class="left-profile">

                <div class="photo">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2>João</h2>

            </div>

            <!-- INFO -->

            <div class="info-box">

                <div class="info-column">

                    <div class="info-item">
                        <span>Nome</span>
                        <strong>João Sousa</strong>
                    </div>

                    <div class="info-item">
                        <span>Número de telefone</span>
                        <strong>89 994369177</strong>
                    </div>

                    <div class="info-item">
                        <span>Email</span>
                        <strong>slaoqescreveaqui@gm...</strong>
                    </div>

                    <div class="info-item">
                        <span>Data nascimento</span>
                        <strong>10/10/2001</strong>
                    </div>

                </div>

                <div class="info-column">

                    <div class="info-item">
                        <span>Total de pets</span>
                        <strong>2 pets</strong>
                    </div>

                    <div class="info-item">
                        <span>Vacinação de pets</span>
                        <strong>Atrasado</strong>
                    </div>

                    <div class="info-item">
                        <span>Vermífugo de pets</span>
                        <strong>Atrasado</strong>
                    </div>

                </div>

            </div>

            <!-- BOTÃO -->

            <div class="button-area">

                <button id="editBtn">
                    EDITAR
                </button>

            </div>

        </section>

    </main>

    <script src="js/pu1.js"></script>

</body>
</html>
