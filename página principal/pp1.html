<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifePet</title>

    <link rel="stylesheet" href="css/pp1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- MENU LATERAL -->

    <aside class="sidebar" id="sidebar">

        <div>

            <!-- LOGO SUPERIOR -->
            <img src="img/Logo2.png" alt="Logo" class="sidebar-logo">

            <nav class="menu">

                <a href="#">
                    <i class="fa-regular fa-calendar-days"></i>
                    Calendário >
                </a>

                <a href="#">
                    <i class="fa-regular fa-clipboard"></i>
                    Histórico >
                </a>

                <a href="#">
                    <i class="fa-regular fa-circle-user"></i>
                    Meu perfil >
                </a>

            </nav>

        </div>

        <div class="bottom-menu">

            <a href="#">
                <i class="fa-solid fa-gear"></i>
                Configurações
            </a>

            <a href="#">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
            </a>

        </div>

    </aside>

    <!-- HEADER -->

    <header>

        <div class="left-header">

            <!-- BOTÃO MENU -->
            <i class="fa-solid fa-bars menu-button" id="menuButton"></i>

            <!-- PESQUISA -->

            <div class="search-box">

                <input
                type="text"
                placeholder="Pesquise aqui o que está procurando...">

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </div>

        <!-- DIREITA -->

        <div class="right-header">

            <i class="fa-regular fa-calendar-days"></i>

            <i class="fa-regular fa-bell"></i>

            <div class="profile"></div>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <h2>Meus Pets</h2>

        <div class="pets-container">

            <!-- PET -->

            <div class="pet-card">

                <!-- FOTO PET -->
                <img src="img/image.png" alt="Pet">

                <h3>Caramelo</h3>
                <p>Cachorro</p>

            </div>

            <!-- ADICIONAR -->

            <div class="add-card">

                <i class="fa-solid fa-plus"></i>

                <p>Adicionar</p>

            </div>

        </div>

        <!-- LOGO CANTO -->

        <img src="img/icon.png" alt="Logo" class="corner-logo">

    </main>

    <script src="js/pp1.js"></script>

</body>
</html>
