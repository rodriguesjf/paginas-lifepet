<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações - LifePet</title>

    <link rel="stylesheet" href="css/tc1.css">

    <!-- FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

    <!-- MENU LATERAL -->

    <aside class="sidebar" id="sidebar">

        <div>

            <!-- LOGO -->
            <img src="img/Logo2.png" alt="Logo" class="sidebar-logo">

            <nav class="menu">

                <a href="#">
                    <i class="fa-regular fa-calendar-days"></i>
                    Calendário >
                </a>

                <a href="#">
                    <i class="fa-regular fa-clipboard"></i>
                    Histórico >
                </a>

                <a href="#">
                    <i class="fa-regular fa-circle-user"></i>
                    Meu perfil >
                </a>

            </nav>

        </div>

        <div class="bottom-menu">

            <a href="#">
                <i class="fa-solid fa-gear"></i>
                Configurações
            </a>

            <a href="#">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
            </a>

        </div>

    </aside>

    <!-- HEADER -->

    <header>

        <div class="left-header">

            <!-- MENU -->
            <i class="fa-solid fa-bars menu-button"
            id="menuButton"></i>

            <!-- PESQUISA -->

            <div class="search-box">

                <input
                type="text"
                placeholder="Pesquise aqui o que está procurando...">

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </div>

        <!-- DIREITA -->

        <div class="right-header">

            <i class="fa-regular fa-calendar-days"></i>

            <i class="fa-regular fa-bell"></i>

            <div class="profile-mini">
                <i class="fa-solid fa-user"></i>
            </div>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <!-- TÍTULO -->

        <div class="page-title">

            <i class="fa-solid fa-arrow-left"></i>

            <h1>Configurações</h1>

        </div>

        <!-- CARDS -->

        <section class="settings-grid">

            <!-- CARD -->

            <div class="settings-card">

                <i class="fa-solid fa-universal-access"></i>

                <h2>Acessibilidade</h2>

            </div>

            <!-- CARD -->

            <div class="settings-card">

                <i class="fa-solid fa-user-shield"></i>

                <h2>Privacidade</h2>

            </div>

            <!-- CARD -->

            <div class="settings-card">

                <i class="fa-solid fa-circle-user"></i>

                <h2>Informação de perfil</h2>

            </div>

            <!-- CARD -->

            <div class="settings-card">

                <i class="fa-regular fa-comments"></i>

                <h2>Feedback</h2>

            </div>

            <!-- CARD -->

            <div class="settings-card">

                <i class="fa-solid fa-headset"></i>

                <h2>Suporte</h2>

            </div>

        </section>

        <!-- LOGO -->

        <img src="img/icon.png" alt="Logo"
        class="corner-logo">

    </main>

    <script src="js/tc1.js"></script>

</body>
</html>
