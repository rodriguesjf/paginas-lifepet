<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - LifePet</title>

    <link rel="stylesheet" href="css/verificacao1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- LADO ESQUERDO -->
        <div class="left-side">

            <!-- COLOQUE O CAMINHO DA LOGO AQUI -->
            <img src="img/icon.png" alt="Logo LifePet" class="logo">

        </div>

        <!-- LADO DIREITO -->
        <div class="right-side">

            <div class="confirm-box">

                <h1>CADASTRO</h1>

                <p class="text">
                    ENVIAMOS UM CÓDIGO DE<br>
                    CONFIRMAÇÃO PARA O SEU E-MAIL!<br>
                    DIGITE O SEU CÓDIGO DE<br>
                    CONFIRMAÇÃO:
                </p>

                <!-- CÓDIGOS -->

                <div class="code-inputs">

                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">

                </div>

                <a href="#" class="resend">
                    Reenviar código.
                </a>

                <button>
                    CONFIRMAR
                </button>

                <div class="login-link">
                    <p>
                        Já tem uma conta?
                        <a href="#">Entrar</a>
                    </p>
                </div>

            </div>

        </div>

    </div>

    <script src="js/verificacao1.js"></script>

</body>
</html>
