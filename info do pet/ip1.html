<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Informações do Pet - LifePet</title>

    <link rel="stylesheet" href="css/ip1.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

    <!-- MENU LATERAL -->

<aside class="sidebar" id="sidebar">

    <div>

        <!-- LOGO -->
        <img src="img/Logo2.png" alt="Logo" class="sidebar-logo">

        <nav class="menu">

            <a href="#">
                <i class="fa-regular fa-calendar-days"></i>
                Calendário >
            </a>

            <a href="#">
                <i class="fa-regular fa-clipboard"></i>
                Histórico >
            </a>

            <a href="#">
                <i class="fa-regular fa-circle-user"></i>
                Meu perfil >
            </a>

        </nav>

    </div>

    <div class="bottom-menu">

        <a href="#">
            <i class="fa-solid fa-gear"></i>
            Configurações
        </a>

        <a href="#">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
        </a>

    </div>

    </aside>

    <!-- HEADER -->

    <header>

        <!-- ESQUERDA -->

        <div class="left-header">

            <!-- MENU -->

            <div class="menu-icon" id = "menuButton">
                <i class="fa-solid fa-bars"></i>
            </div>

            <!-- PESQUISA -->

            <div class="search-box">

                <input
                type="text"
                placeholder="Pesquise aqui o que está procurando...">

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </div>

        <!-- DIREITA -->

        <div class="header-icons">

            <i class="fa-regular fa-calendar-days"></i>

            <i class="fa-regular fa-bell"></i>

            <div class="profile-mini">
                <i class="fa-solid fa-user"></i>
            </div>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <!-- TÍTULO -->

        <div class="page-title">

            <div class="back-button">
                <i class="fa-solid fa-arrow-left"></i>
            </div>

            <h1>Informações do pet</h1>

        </div>

        <!-- CARD PET -->

        <section class="pet-container">

            <!-- FOTO -->

            <div class="pet-photo">

                <!-- FOTO DO PET -->
                <img src="img/image.png" alt="Pet">

            </div>

            <!-- INFO -->

            <div class="pet-info">

                <div class="info-column">

                    <div class="info-item">
                        <span>Nome</span>
                        <strong>Caramelo</strong>
                    </div>

                    <div class="info-item">
                        <span>Espécie</span>
                        <strong>Cachorro</strong>
                    </div>

                    <div class="info-item">
                        <span>Raça</span>
                        <strong>SRD</strong>
                    </div>

                </div>

                <div class="info-column">

                    <div class="info-item">
                        <span>Idade</span>
                        <strong>3 anos</strong>
                    </div>

                    <div class="info-item">
                        <span>Sexo</span>
                        <strong>Masculino</strong>
                    </div>

                    <div class="info-item">
                        <span>Vacinação</span>
                        <strong>Atrasada</strong>
                    </div>

                </div>

                <div class="info-column">

                    <div class="info-item">
                        <span>Peso</span>
                        <strong>15kg</strong>
                    </div>

                    <div class="info-item">
                        <span>Castração</span>
                        <strong>Não</strong>
                    </div>

                    <div class="info-item">
                        <span>Medicamentos contínuos</span>
                        <strong>Não</strong>
                    </div>

                </div>

                <div class="info-column">

                    <div class="info-item">
                        <span>Alergias</span>
                        <strong>a1</strong>
                        <strong>a2</strong>
                        <strong>a3</strong>
                        <strong>a4</strong>
                    </div>

                </div>

            </div>

            <!-- BOTÕES -->

            <div class="buttons-area">

                <button class="edit-btn">
                    EDITAR
                </button>

                <button class="delete-btn">
                    EXCLUIR
                </button>

            </div>

        </section>

        <!-- VACINAÇÃO -->

        <section class="section-box">

            <h2>Carteira de vacinação</h2>

            <div class="content-box"></div>

        </section>

        <!-- VERMÍFUGO -->

        <section class="section-box">

            <h2>Controle de Vermífugo</h2>

            <div class="content-box"></div>

        </section>

        <!-- LOGO -->

        <img src="img/icon.png" alt="Logo" class="corner-logo">

    </main>

    <script src="js/ip1.js"></script>

</body>
</html>
